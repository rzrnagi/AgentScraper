targets:
  - name: sutures_surgical
    url: https://www.safcodental.com/catalog/sutures-surgical-products
    category: "Sutures & Surgical Products"
  - name: gloves
    url: https://www.safcodental.com/catalog/gloves
    category: "Dental Exam Gloves"

crawl:
  request_delay_seconds: 1.5
  request_delay_jitter: 0.5
  max_retries: 3
  retry_backoff_base: 2.0
  page_load_timeout_ms: 30000
  headless: true

output:
  dir: ./output
  db_file: ./output/products.db
  csv_file: ./output/products.csv
  json_file: ./output/products.json

checkpoint:
  file: ./checkpoint.json

logging:
  level: INFO
  file: ./logs/scraper.log

llm:
  model: claude-haiku-4-5-20251001
  max_tokens: 1024
  use_for_extraction_fallback: true
  use_for_page_classification: true
